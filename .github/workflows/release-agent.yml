name: Release agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # signed provenance (Sigstore)
  attestations: write

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build agent packages
        run: scripts/publish-agent.sh agent-packages
      - name: Checksums
        run: cd agent-packages && sha256sum * | grep -v SHA256SUMS > SHA256SUMS
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: agent-packages/odm-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Signed build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: agent-packages/*
      - uses: actions/upload-artifact@v7
        with:
          name: agent-packages
          path: agent-packages/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" agent-packages/* --generate-notes
