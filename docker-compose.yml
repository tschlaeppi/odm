services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: odm
      POSTGRES_USER: odm
      POSTGRES_PASSWORD: ${ODM_DB_PASSWORD:?ODM_DB_PASSWORD in .env setzen}
    volumes:
      - odm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odm -d odm"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-kompatibler Paketspeicher (RustFS). Jeder andere S3-Dienst funktioniert ebenso: Storage__S3__* anpassen.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: odm
      RUSTFS_SECRET_KEY: ${ODM_S3_PASSWORD:?ODM_S3_PASSWORD in .env setzen (mindestens 8 Zeichen)}
    volumes:
      - odm-packages:/data

  odm:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - odm-pki:/pki
    environment:
      Database__Provider: Postgres
      Database__ConnectionString: Host=db;Database=odm;Username=odm;Password=${ODM_DB_PASSWORD}
      Storage__S3__ServiceUrl: http://s3:9000
      Storage__S3__Bucket: odm-packages
      Storage__S3__AccessKey: odm
      Storage__S3__SecretKey: ${ODM_S3_PASSWORD}
      Secrets__MasterKey: ${ODM_SECRETS_KEY:?ODM_SECRETS_KEY in .env setzen (openssl rand -base64 32)}
      Jwt__Secret: ${ODM_JWT_SECRET:?ODM_JWT_SECRET in .env setzen}
      Identity__BootstrapAdmin__UserName: ${ODM_ADMIN_USER:-admin}
      Identity__BootstrapAdmin__Password: ${ODM_ADMIN_PASSWORD:?ODM_ADMIN_PASSWORD in .env setzen}
      # Optional: Anmeldung gegen LDAP/Active Directory (siehe README)
      Identity__Ldap__Enabled: ${ODM_LDAP_ENABLED:-false}
      Identity__Ldap__Host: ${ODM_LDAP_HOST:-}
      Identity__Ldap__Port: ${ODM_LDAP_PORT:-636}
      Identity__Ldap__Security: ${ODM_LDAP_SECURITY:-Ldaps}
      Identity__Ldap__BaseDn: ${ODM_LDAP_BASE_DN:-}
      Identity__Ldap__BindDn: ${ODM_LDAP_BIND_DN:-}
      Identity__Ldap__BindPassword: ${ODM_LDAP_BIND_PASSWORD:-}
      Identity__Ldap__AdminGroup: ${ODM_LDAP_ADMIN_GROUP:-}
      Identity__Ldap__OperatorGroup: ${ODM_LDAP_OPERATOR_GROUP:-}
      Identity__Ldap__ReadOnlyGroup: ${ODM_LDAP_READONLY_GROUP:-}
      # Agents: Selbstaktualisierung (Off | Latest | Pinned) und öffentliche Server-Adresse für die Installationsskripte
      Agents__Update__Mode: ${ODM_AGENT_UPDATE_MODE:-Off}
      Agents__Update__TargetVersion: ${ODM_AGENT_UPDATE_VERSION:-}
      Agents__Update__RolloutPercent: ${ODM_AGENT_UPDATE_PERCENT:-100}
      Agents__PublicBaseUrl: ${ODM_PUBLIC_URL:-}
      # Agents: Client-Zertifikate (mTLS). Aus | Optional | Required; die CA liegt im Volume odm-pki. Erfordert HTTPS am Server (siehe README).
      Agents__Mtls__Mode: ${ODM_MTLS_MODE:-Off}
      Agents__Mtls__CaDirectory: /pki
      # Optional: Anmeldung über OpenID Connect (Entra ID, authentik ...), siehe README. Beispiel für einen Anbieter:
      # Identity__Oidc__PublicBaseUrl: https://odm.example.org
      # Identity__Oidc__Providers__0__Id: authentik
      # Identity__Oidc__Providers__0__DisplayName: authentik
      # Identity__Oidc__Providers__0__Authority: https://auth.example.org/application/o/odm/
      # Identity__Oidc__Providers__0__ClientId: ${ODM_OIDC_CLIENT_ID}
      # Identity__Oidc__Providers__0__ClientSecret: ${ODM_OIDC_CLIENT_SECRET}
      # Identity__Oidc__Providers__0__AdminValues__0: odm-admins

volumes:
  odm-pki:
  odm-db:
  odm-packages:
