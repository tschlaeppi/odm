{{- if not .Values.existingSecret }}
{{- $db := .Values.database.connectionString }}
{{- if .Values.postgresql.enabled }}
{{- $db = printf "Host=%s;Database=odm;Username=odm;Password=%s" (include "odm.dbHost" .) (required "postgresql.password is required when postgresql.enabled=true" .Values.postgresql.password) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odm.fullname" . }}
  labels: {{- include "odm.labels" . | nindent 4 }}
type: Opaque
stringData:
  jwtSecret: {{ required "secrets.jwtSecret is required (or use existingSecret)" .Values.secrets.jwtSecret | quote }}
  secretsKey: {{ required "secrets.secretsKey is required (or use existingSecret)" .Values.secrets.secretsKey | quote }}
  adminPassword: {{ required "secrets.adminPassword is required (or use existingSecret)" .Values.secrets.adminPassword | quote }}
  databaseConnectionString: {{ required "database.connectionString is required unless postgresql.enabled=true" $db | quote }}
  s3SecretKey: {{ .Values.s3.secretKey | quote }}
  ldapBindPassword: {{ .Values.secrets.ldapBindPassword | quote }}
  oidcClientSecret: {{ .Values.secrets.oidcClientSecret | quote }}
{{- end }}
