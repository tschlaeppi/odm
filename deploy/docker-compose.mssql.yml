# ODM with SQL Server instead of PostgreSQL. Start from the repository root:
#   docker compose -f deploy/docker-compose.mssql.yml --env-file .env up -d --build
# Prerequisite: the SQL Server migrations are committed (scripts/ef-sqlserver.*).
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${ODM_DB_PASSWORD:?set ODM_DB_PASSWORD in .env (at least 8 characters, upper and lower case letters, digits)}
    volumes:
      - odm-db:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # S3-compatible package store (RustFS). Any other S3 service works too: adjust Storage__S3__*.
  s3:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: odm
      RUSTFS_SECRET_KEY: ${ODM_S3_PASSWORD:?set ODM_S3_PASSWORD in .env (at least 8 characters)}
    volumes:
      - odm-packages:/data

  odm:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - odm-pki:/pki
    environment:
      Database__Provider: SqlServer
      # The password must not contain ';'. In production use a dedicated account instead of 'sa' (see docs/operations.md).
      Database__ConnectionString: Server=db;Database=odm;User Id=sa;Password=${ODM_DB_PASSWORD};TrustServerCertificate=True
      Storage__S3__ServiceUrl: http://s3:9000
      Storage__S3__Bucket: odm-packages
      Storage__S3__AccessKey: odm
      Storage__S3__SecretKey: ${ODM_S3_PASSWORD}
      Secrets__MasterKey: ${ODM_SECRETS_KEY:?set ODM_SECRETS_KEY in .env (openssl rand -base64 32)}
      Jwt__Secret: ${ODM_JWT_SECRET:?set ODM_JWT_SECRET in .env}
      Identity__BootstrapAdmin__UserName: ${ODM_ADMIN_USER:-admin}
      Identity__BootstrapAdmin__Password: ${ODM_ADMIN_PASSWORD:?set ODM_ADMIN_PASSWORD in .env}
      # Optional: sign-in against LDAP / Active Directory (see docs/authentication.md)
      Identity__Ldap__Enabled: ${ODM_LDAP_ENABLED:-false}
      Identity__Ldap__Host: ${ODM_LDAP_HOST:-}
      Identity__Ldap__Port: ${ODM_LDAP_PORT:-636}
      Identity__Ldap__Security: ${ODM_LDAP_SECURITY:-Ldaps}
      Identity__Ldap__BaseDn: ${ODM_LDAP_BASE_DN:-}
      Identity__Ldap__BindDn: ${ODM_LDAP_BIND_DN:-}
      Identity__Ldap__BindPassword: ${ODM_LDAP_BIND_PASSWORD:-}
      Identity__Ldap__AdminGroup: ${ODM_LDAP_ADMIN_GROUP:-}
      Identity__Ldap__OperatorGroup: ${ODM_LDAP_OPERATOR_GROUP:-}
      Identity__Ldap__ReadOnlyGroup: ${ODM_LDAP_READONLY_GROUP:-}
      # Agents: self-update (Off | Latest | Pinned) and public server address for the install scripts
      Agents__Update__Mode: ${ODM_AGENT_UPDATE_MODE:-Off}
      Agents__Update__TargetVersion: ${ODM_AGENT_UPDATE_VERSION:-}
      Agents__Update__RolloutPercent: ${ODM_AGENT_UPDATE_PERCENT:-100}
      Agents__PublicBaseUrl: ${ODM_PUBLIC_URL:-}
      # Agents: client certificates (mTLS): Off | Optional | Required; the CA lives in the odm-pki volume. Requires HTTPS at the server (see docs/agent.md).
      Agents__Mtls__Mode: ${ODM_MTLS_MODE:-Off}
      Agents__Mtls__CaDirectory: /pki
      # Optional: sign-in via OpenID Connect (Entra ID, authentik ...), see docs/authentication.md. Example for one provider:
      # Identity__Oidc__PublicBaseUrl: https://odm.example.org
      # Identity__Oidc__Providers__0__Id: authentik
      # Identity__Oidc__Providers__0__DisplayName: authentik
      # Identity__Oidc__Providers__0__Authority: https://auth.example.org/application/o/odm/
      # Identity__Oidc__Providers__0__ClientId: ${ODM_OIDC_CLIENT_ID}
      # Identity__Oidc__Providers__0__ClientSecret: ${ODM_OIDC_CLIENT_SECRET}
      # Identity__Oidc__Providers__0__AdminValues__0: odm-admins

volumes:
  odm-pki:
  odm-db:
  odm-packages:
